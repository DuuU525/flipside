<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金色瞬间 · 彩蛋原型</title>
<style>
  :root { --fg: #e8edf5; --muted: #8fa0b8; --accent: #ffd166; --border: rgba(255,255,255,.12); --card: rgba(20,28,42,.6); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "SimSun", "Courier New", monospace;
    background: radial-gradient(1200px 700px at 50% 0%, #16233a, #0a1322);
    color: var(--fg); min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 32px 16px; -webkit-font-smoothing: none;
  }
  h1 { font-size: 20px; letter-spacing: 2px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; text-align: center; }
  #world { background: linear-gradient(#1f3d63, #0c1e38); border: 1px solid var(--border); border-radius: 10px; cursor: crosshair; }
  .controls { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; justify-content: center; align-items: center; }
  button {
    font-family: inherit; font-size: 15px; padding: 10px 18px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--card); color: var(--fg); letter-spacing: 1px;
    transition: transform .08s, border-color .15s;
  }
  button:hover { border-color: var(--accent); }
  button:active { transform: scale(.96); }
  button.force { border-color: #ffd166; color: #ffd166; }
  label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  input[type=range] { width: 160px; accent-color: #ffd166; }
  #prob { color: #ffd166; min-width: 40px; text-align: right; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 14px; line-height: 1.7; text-align: center; }
  .stat { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .stat b { color: #ffd166; }
</style>
</head>
<body>
  <h1>金色瞬间 · 彩蛋原型</h1>
  <div class="sub">普通抛瓶 vs 金色瞬间（稀有惊喜）的手感对比</div>
  <canvas id="world" width="880" height="500"></canvas>
  <div class="controls">
    <button id="throw">抛瓶（蓄力时机）</button>
    <button id="force" class="force">必触发金色瞬间</button>
    <label>触发概率
      <input type="range" id="p" min="0" max="50" value="20" step="1">
      <span id="prob">20%</span>
    </label>
  </div>
  <div class="stat">抛瓶 <b id="n">0</b> 次 · 金色瞬间 <b id="g">0</b> 次</div>
  <div class="hint">
    金色瞬间 = 瓶子飞出 <b style="color:#ffd166">金色拖尾</b> → 落地 <b style="color:#ffd166">金色彩带爆</b> + 屏闪<br>
    金色浮动文字「金色瞬间！×10」+ 专属高光音效（与普通倒立明显区分）
  </div>

<script>
(() => {
  'use strict';
  const cv = document.getElementById('world'), ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const tableTop = H - 90;               // 桌面线
  const baseX = W / 2, baseY = tableTop; // 瓶子脚点

  // ---- 瓶子状态 ----
  let flying = null;       // { t0, dur, fromX, toX, peak, result }
  let bottle = { state: 'upright' };     // 落地后的瓶子姿态
  let prob = 0.20;

  // ---- 粒子(彩带/金色拖尾) ----
  const parts = [];        // { x,y,vx,vy,rot,vr,life,age,color,size }
  const trails = [];       // 金色拖尾残影 { x,y,age,life }

  let n = 0, g = 0;

  // ---- 音效(WebAudio 合成) ----
  let actx = null;
  function ensure() {
    if (!actx) { try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, dur, type, vol, when, slideTo) {
    const c = ensure(); if (!c) return;
    const t = c.currentTime + (when||0);
    const o = c.createOscillator(), gn = c.createGain();
    o.type = type||'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo), t+dur);
    const v = Math.max(0.0001, vol||0.15);
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(v, t+0.008);
    gn.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(gn); gn.connect(c.destination);
    o.start(t); o.stop(t+dur+0.05);
  }
  function sfxNormal()   { tone(660,0.12,'sine',0.12); tone(880,0.16,'sine',0.12,0.08); }
  function sfxGolden() {
    // 金色专属: 快速上行滑音 + 金色彩带琶音(比普通倒立更"闪")
    tone(523,0.10,'triangle',0.16,0,1046);
    [659,784,988,1319,1568].forEach((f,i)=>tone(f,0.16,'sine',0.14,i*0.06));
    tone(2093,0.22,'sine',0.10,0.30);
  }

  // ---- 抛瓶 ----
  function throwBottle(forceGolden) {
    if (flying) return;
    n++;
    const isGolden = forceGolden || Math.random() < prob;
    // 落点随机左右偏移
    const toX = baseX + (Math.random()*2-1) * 240;
    flying = { t0: performance.now(), dur: 620, fromX: baseX, toX, peak: 150, isGolden };
    if (isGolden) g++;
  }

  // ---- 金色彩带爆 ----
  function goldenBurst(x, y) {
    for (let i = 0; i < 46; i++) {
      const ang = Math.random()*Math.PI*2;
      const spd = 2 + Math.random()*5;
      parts.push({
        x, y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd - 2.5,
        rot: Math.random()*Math.PI*2, vr: (Math.random()*2-1)*0.3,
        age: 0, life: 700+Math.random()*500,
        color: ['#ffd166','#ffc857','#ffe08a','#fff3c4','#ffb703'][Math.floor(Math.random()*5)],
        size: 3+Math.random()*4,
      });
    }
  }

  // ---- 绘制瓶子 ----
  function drawBottle(x, footY, state, golden) {
    ctx.save();
    const s = 0.8;
    const bw = 18*s, tw = 7*s, hh = 60*s;
    let cx = x, cy = footY, rot = 0;
    if (state === 'upright') { cy = footY - hh; }
    else if (state === 'inverted') { cy = footY - hh; rot = Math.PI; }  // 倒立=瓶口朝下(简化为翻转)
    else { cy = footY - bw; rot = Math.PI/2; }                           // 平躺

    ctx.translate(cx, cy);
    ctx.rotate(rot);
    // 瓶身(梯形)
    const grad = ctx.createLinearGradient(0,-hh,0,hh);
    if (golden) {
      grad.addColorStop(0, 'rgba(255,224,138,.85)');
      grad.addColorStop(1, 'rgba(255,183,3,.55)');
    } else {
      grad.addColorStop(0, 'rgba(150,205,255,.55)');
      grad.addColorStop(1, 'rgba(90,150,220,.35)');
    }
    ctx.fillStyle = grad;
    ctx.strokeStyle = golden ? '#ffd166' : 'rgba(255,255,255,.45)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-bw, -hh); ctx.lineTo(bw, -hh); ctx.lineTo(tw, hh); ctx.lineTo(-tw, hh);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // 瓶口
    ctx.fillStyle = golden ? '#fff3c4' : 'rgba(255,255,255,.7)';
    ctx.fillRect(-tw-2, -hh-6, (tw+2)*2, 6);
    if (golden) {  // 金色光晕
      ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 22;
      ctx.strokeStyle = 'rgba(255,209,102,.9)'; ctx.lineWidth = 2;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }

  // ---- 主循环 ----
  let last = performance.now();
  function loop(now) {
    const dt = now - last; last = now;
    ctx.clearRect(0,0,W,H);

    // 桌面
    ctx.fillStyle = 'rgba(0,0,0,.15)';
    ctx.fillRect(0, tableTop-2, W, H-tableTop+2);
    ctx.strokeStyle = 'rgba(255,255,255,.08)';
    ctx.beginPath(); ctx.moveTo(0, tableTop); ctx.lineTo(W, tableTop); ctx.stroke();

    // 更新飞行
    let flyingBottle = null;
    if (flying) {
      const t = Math.min(1, (now - flying.t0) / flying.dur);
      const x = flying.fromX + (flying.toX - flying.fromX) * t;
      const hgt = flying.peak * Math.sin(Math.PI * t);
      const footY = tableTop - hgt;
      if (flying.isGolden) {
        // 金色拖尾
        trails.push({ x, y: footY, age: 0, life: 300 });
        // 金色光晕
        const gl = ctx.createRadialGradient(x, footY-30, 2, x, footY-30, 60);
        gl.addColorStop(0, 'rgba(255,209,102,.35)'); gl.addColorStop(1, 'rgba(255,209,102,0)');
        ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(x, footY-30, 60, 0, Math.PI*2); ctx.fill();
      }
      flyingBottle = { x, footY, golden: flying.isGolden };
      if (t >= 1) {
        // 落地结算
        bottle.state = flying.isGolden ? 'inverted' : (Math.random() < 0.4 ? 'upright' : (Math.random() < 0.3 ? 'inverted' : 'lying'));
        if (flying.isGolden) {
          goldenBurst(x, tableTop);
          sfxGolden();
          // 全屏金色闪光
          ctx.fillStyle = 'rgba(255,209,102,.22)';
          ctx.fillRect(0,0,W,H);
        } else {
          sfxNormal();
        }
        flying = null;
      }
    }

    // 绘制拖尾
    for (let i = trails.length-1; i>=0; i--) {
      const tr = trails[i]; tr.age += dt;
      if (tr.age >= tr.life) { trails.splice(i,1); continue; }
      const a = 1 - tr.age/tr.life;
      ctx.fillStyle = 'rgba(255,209,102,' + (a*0.5) + ')';
      ctx.beginPath(); ctx.arc(tr.x, tr.y-30, 6*a+2, 0, Math.PI*2); ctx.fill();
    }

    // 绘制落地瓶子
    if (!flyingBottle) drawBottle(baseX + (bottle.state==='lying'?0:0), tableTop, bottle.state, false);

    // 更新/绘制彩带粒子
    for (let i = parts.length-1; i>=0; i--) {
      const p = parts[i]; p.age += dt;
      if (p.age >= p.life) { parts.splice(i,1); continue; }
      p.vy += 0.22 * dt/16;
      p.x += p.vx * dt/16; p.y += p.vy * dt/16;
      p.rot += p.vr * dt/16;
      const a = 1 - p.age/p.life;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = a; ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    // 飞行瓶子最上层
    if (flyingBottle) drawBottle(flyingBottle.x, flyingBottle.footY, 'upright', flyingBottle.golden);

    requestAnimationFrame(loop);
  }

  // ---- 交互 ----
  document.getElementById('throw').addEventListener('click', () => { ensure(); throwBottle(false); });
  document.getElementById('force').addEventListener('click', () => { ensure(); throwBottle(true); });
  const slider = document.getElementById('p');
  slider.addEventListener('input', () => { prob = slider.value/100; document.getElementById('prob').textContent = slider.value + '%'; });

  // 点击画布也可抛
  cv.addEventListener('click', () => { ensure(); throwBottle(false); });

  // 统计刷新
  setInterval(() => {
    document.getElementById('n').textContent = n;
    document.getElementById('g').textContent = g;
  }, 200);

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
